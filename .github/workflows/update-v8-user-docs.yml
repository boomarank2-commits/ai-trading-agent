name: Apply V8 user docs
on:
  push:
    branches: [agent/promote-v8-paper-candidate]
    paths:
      - research/update_v8_user_docs.py
      - .github/workflows/update-v8-user-docs.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-v8-paper-candidate
          fetch-depth: 0
      - run: python research/update_v8_user_docs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm research/update_v8_user_docs.py .github/workflows/update-v8-user-docs.yml
          git add TESTBOT_ANLEITUNG.md STARTBOT.bat
          git commit -m "Document V8 paper forward behavior"
          git push origin HEAD:agent/promote-v8-paper-candidate
