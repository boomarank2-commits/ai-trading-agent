name: V8 pre-registered earliest unseen confirmation

on:
  push:
    branches: [agent/strategy-v8-slow-donchian]
    paths:
      - ".github/workflows/research-v8-earliest-unseen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras --python 3.12
      - uses: actions/cache@v4
        with:
          path: earliest_data
          key: binance-spot-btc-eth-sol-1m15m1h4h-20200901-20210817-v1
      - name: Download still-unseen older market history
        run: |
          mkdir -p earliest_data earliest_results
          .venv/bin/python -m freqtrade download-data --config runtime/user_data/config.json --config runtime/user_data/config-public.json --config research/config-binance-marketdata-only.json --userdir runtime/user_data --datadir "$PWD/earliest_data" --timeframes 1m 15m 1h 4h --pairs BTC/USDT ETH/USDT SOL/USDT --trading-mode spot --timerange 20200901-20210817
      - name: Prove candle integrity before opening this period
        run: |
          .venv/bin/python - <<'PY' | tee earliest_results/data-integrity.txt
          from pathlib import Path
          import pandas as pd
          sec={'1m':60,'15m':900,'1h':3600,'4h':14400}; fs=sorted(Path('earliest_data').rglob('*.feather')); assert len(fs)==12, len(fs)
          for p in fs:
              d=pd.to_datetime(pd.read_feather(p)['date'],utc=True); tf=next(t for t in sec if f'-{t}' in p.name); x=d.diff().dropna()
              dup=int(d.duplicated().sum()); noninc=int((x<=pd.Timedelta(0)).sum()); gaps=int((x>pd.to_timedelta(sec[tf],unit='s')).sum())
              assert dup==0 and noninc==0 and gaps==0, (p,dup,noninc,gaps)
              assert d.min()<=pd.Timestamp('2020-09-01 00:00:00',tz='UTC'), (p,d.min())
              assert d.max()>=pd.Timestamp('2021-08-16 20:00:00',tz='UTC'), (p,d.max())
              print(f'{p.name}: rows={len(d)} start={d.min()} end={d.max()} duplicates={dup} gaps={gaps}')
          PY
          .venv/bin/python -m py_compile runtime/user_data/strategies/CompressionBreakout250.py
          .venv/bin/ruff check runtime/user_data/strategies/CompressionBreakout250.py
          sha256sum runtime/user_data/strategies/CompressionBreakout250.py | tee earliest_results/strategy-sha256.txt
      - name: Run fixed V8 on unseen 2020-11 to 2021-08 period
        run: |
          set -euo pipefail
          SHA=$(sha256sum runtime/user_data/strategies/CompressionBreakout250.py|awk '{print $1}')
          bt(){ N="$1"; shift; mkdir -p "earliest_results/$N"; .venv/bin/python runtime/locked_backtest_freqtrade.py --strategy-source runtime/user_data/strategies/CompressionBreakout250.py --strategy-sha256 "$SHA" --strategy-class CompressionBreakout250 -- backtesting --config runtime/user_data/config.json --config runtime/user_data/config-public.json --config research/config-binance-marketdata-only.json --userdir runtime/user_data --datadir "$PWD/earliest_data" --strategy CompressionBreakout250 --pairs "$@" --timerange 20201115-20210816 --timeframe-detail 1m --fee 0.002 --enable-protections --dry-run-wallet 250 --cache none --export trades --backtest-directory "earliest_results/$N" > "earliest_results/$N/run.log" 2>&1; }
          bt btc_earliest BTC/USDT
          bt eth_earliest ETH/USDT
          bt sol_earliest SOL/USDT
          bt portfolio_earliest BTC/USDT ETH/USDT SOL/USDT
      - name: Summarize without tuning
        run: |
          .venv/bin/python - <<'PY' | tee earliest_results/SUMMARY.md
          import json,zipfile
          from pathlib import Path
          runs=['btc_earliest','eth_earliest','sol_earliest','portfolio_earliest']
          print('# V8 earliest unseen confirmation\n\n| run | trades | P/L USDT | return % | PF | win % | max DD % |\n|---|---:|---:|---:|---:|---:|---:|')
          for run in runs:
              z=sorted((Path('earliest_results')/run).glob('backtest-result-*.zip'))[-1]
              with zipfile.ZipFile(z) as f:
                  n=[x for x in f.namelist() if x.endswith('.json') and 'config' not in x and 'market_change' not in x][0]; st=json.loads(f.read(n))['strategy']['CompressionBreakout250']
              ts=st.get('trades',[]); c=int(st.get('total_trades',len(ts))); pnl=float(st.get('profit_total_abs',0)); ret=float(st.get('profit_total',0))*100; pf=float(st.get('profit_factor',0) or 0); w=int(st.get('wins',0) or 0); dd=float(st.get('max_drawdown_account',0) or st.get('max_drawdown',0) or 0); dd=dd*100 if abs(dd)<=1 else dd
              print(f'| {run} | {c} | {pnl:.3f} | {ret:.3f} | {pf:.3f} | {(100*w/c if c else 0):.1f} | {dd:.2f} |')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v8-earliest-unseen-confirmation
          path: earliest_results
          retention-days: 30
