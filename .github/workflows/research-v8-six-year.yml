name: V8 exact six-year continuity

on:
  push:
    branches: [agent/strategy-v8-slow-donchian]
    paths: [".github/workflows/research-v8-six-year.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-year:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras --python 3.12
      - uses: actions/cache@v4
        with:
          path: sixyear_data
          key: binance-spot-btc-eth-sol-1m15m1h4h-20200901-20260817-v1
      - name: Download six-year-plus-warmup history
        run: |
          mkdir -p sixyear_data sixyear_results
          .venv/bin/python -m freqtrade download-data --config runtime/user_data/config.json --config runtime/user_data/config-public.json --config research/config-binance-marketdata-only.json --userdir runtime/user_data --datadir "$PWD/sixyear_data" --timeframes 1m 15m 1h 4h --pairs BTC/USDT ETH/USDT SOL/USDT --trading-mode spot --timerange 20200901-20260817
      - name: Prove exact candle continuity
        run: |
          .venv/bin/python - <<'PY' | tee sixyear_results/data-integrity.txt
          from pathlib import Path
          import pandas as pd
          sec={'1m':60,'15m':900,'1h':3600,'4h':14400}; fs=sorted(Path('sixyear_data').rglob('*.feather')); assert len(fs)==12, len(fs)
          for p in fs:
              d=pd.to_datetime(pd.read_feather(p)['date'],utc=True); tf=next(t for t in sec if f'-{t}' in p.name); x=d.diff().dropna()
              dup=int(d.duplicated().sum()); bad=int((x<=pd.Timedelta(0)).sum()); gaps=int((x>pd.to_timedelta(sec[tf],unit='s')).sum())
              assert dup==0 and bad==0 and gaps==0, (p,dup,bad,gaps)
              assert d.min()<=pd.Timestamp('2020-09-01',tz='UTC') and d.max()>=pd.Timestamp('2026-08-15 16:00',tz='UTC')
              print(f'{p.name}: rows={len(d)} start={d.min()} end={d.max()} duplicates={dup} gaps={gaps}')
          PY
          .venv/bin/python -m py_compile runtime/user_data/strategies/CompressionBreakout250.py
          .venv/bin/ruff check runtime/user_data/strategies/CompressionBreakout250.py
          sha256sum runtime/user_data/strategies/CompressionBreakout250.py | tee sixyear_results/strategy-sha256.txt
      - name: Run exact six-year pair and portfolio tests at conservative fee
        run: |
          set -euo pipefail
          SHA=$(sha256sum runtime/user_data/strategies/CompressionBreakout250.py|awk '{print $1}')
          bt(){ N="$1"; F="$2"; shift 2; mkdir -p "sixyear_results/$N"; .venv/bin/python runtime/locked_backtest_freqtrade.py --strategy-source runtime/user_data/strategies/CompressionBreakout250.py --strategy-sha256 "$SHA" --strategy-class CompressionBreakout250 -- backtesting --config runtime/user_data/config.json --config runtime/user_data/config-public.json --config research/config-binance-marketdata-only.json --userdir runtime/user_data --datadir "$PWD/sixyear_data" --strategy CompressionBreakout250 --pairs "$@" --timerange 20201115-20260816 --timeframe-detail 1m --fee "$F" --enable-protections --dry-run-wallet 250 --cache none --export trades --backtest-directory "sixyear_results/$N" --breakdown year > "sixyear_results/$N/run.log" 2>&1; }
          bt btc_6y 0.002 BTC/USDT
          bt eth_6y 0.002 ETH/USDT
          bt sol_6y 0.002 SOL/USDT
          bt portfolio_6y 0.002 BTC/USDT ETH/USDT SOL/USDT
          bt portfolio_6y_fee004 0.004 BTC/USDT ETH/USDT SOL/USDT
      - name: Summarize six-year evidence
        run: |
          .venv/bin/python - <<'PY' | tee sixyear_results/SUMMARY.md
          import json,zipfile
          from pathlib import Path
          runs=['btc_6y','eth_6y','sol_6y','portfolio_6y','portfolio_6y_fee004']
          print('# V8 exact six-year continuity summary\n\n| run | trades | P/L USDT | return % | PF | win % | max DD % | worst day |\n|---|---:|---:|---:|---:|---:|---:|---:|')
          for run in runs:
              z=sorted((Path('sixyear_results')/run).glob('backtest-result-*.zip'))[-1]
              with zipfile.ZipFile(z) as f:
                  n=[x for x in f.namelist() if x.endswith('.json') and 'config' not in x and 'market_change' not in x][0]; st=json.loads(f.read(n))['strategy']['CompressionBreakout250']
              ts=st.get('trades',[]); c=int(st.get('total_trades',len(ts))); pnl=float(st.get('profit_total_abs',0)); ret=float(st.get('profit_total',0))*100; pf=float(st.get('profit_factor',0) or 0); w=int(st.get('wins',0) or 0); dd=float(st.get('max_drawdown_account',0) or st.get('max_drawdown',0) or 0); dd=dd*100 if abs(dd)<=1 else dd; worst=float(st.get('backtest_worst_day_abs',0) or 0)
              print(f'| {run} | {c} | {pnl:.3f} | {ret:.3f} | {pf:.3f} | {(100*w/c if c else 0):.1f} | {dd:.2f} | {worst:.3f} |')
              rs={}
              for t in ts:
                  r=t.get('exit_reason','unknown'); rs.setdefault(r,[0,0.]); rs[r][0]+=1; rs[r][1]+=float(t.get('profit_abs',0) or 0)
              print(); print('## '+run+' exits'); [print(f'- {r}: {v[0]} trades, {v[1]:.3f} USDT') for r,v in sorted(rs.items(),key=lambda x:x[1][1])]; print()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v8-exact-six-year-continuity
          path: sixyear_results
          retention-days: 30
