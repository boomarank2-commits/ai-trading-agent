name: Audit V8 database references
on:
  push:
    branches: [agent/promote-v8-paper-candidate]
    paths: [".github/workflows/audit-v8-db-references.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show all legacy database references
        shell: bash
        run: |
          echo '--- tracked references to tradesv3.dryrun.sqlite ---'
          git grep -n 'tradesv3\.dryrun\.sqlite' || true
          echo '--- tracked references to tradesv8.dryrun.sqlite ---'
          git grep -n 'tradesv8\.dryrun\.sqlite' || true
