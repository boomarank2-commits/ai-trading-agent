name: Apply 2026-08-15 handover

on:
  push:
    branches:
      - docs/2026-08-15-research-handover
    paths:
      - research/apply_20260815_handover.py
      - .github/workflows/apply-20260815-handover.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/2026-08-15-research-handover
          fetch-depth: 0
      - name: Apply handover and UI fixes
        run: |
          python research/apply_20260815_handover.py
          grep -q 'Verbindlicher Projektstand nach Backtest-Audit' CODEX_NEXT_PHASE_LIVE_REPLAY_DE.md
          grep -q '15m-, 1m-, 1h- und 4h-Kerzen' runtime/ui/testbot-backtest.js
          grep -q 'balanceMoney' runtime/ui/testbot-backtest.js
      - name: Commit durable files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm research/apply_20260815_handover.py
          git rm .github/workflows/apply-20260815-handover.yml
          git add CODEX_NEXT_PHASE_LIVE_REPLAY_DE.md runtime/ui/testbot-backtest.js
          git commit -m "Document backtest audit and improve UI transparency"
          git push origin HEAD:docs/2026-08-15-research-handover
