name: Testbot Backtest UI

# Exact-strategy loading and candle/history integrity gate for the active paper/backtest UI.
on:
  push:
    branches:
      - main
      - agent/v12-adaptive-league
      - agent/v12-17-ten-pair-research-ui
    paths:
      - "runtime/testbot_backtest_api.py"
      - "runtime/ten_pair_backtest_api.py"
      - "runtime/locked_backtest_freqtrade.py"
      - "runtime/locked_freqtrade.py"
      - "runtime/patch_frequi.py"
      - "runtime/ui/testbot-backtest.js"
      - "runtime/scripts/setup-venv.ps1"
      - "runtime/user_data/config.json"
      - "runtime/user_data/strategies/CompressionBreakout250.py"
      - "tests/test_testbot_backtest_api.py"
      - "tests/test_backtest_history_coverage.py"
      - "tests/test_backtest_candle_integrity.py"
      - "tests/runtime/test_v12_17_ten_pair_research_contract.py"
      - ".github/workflows/windows-backtest-ui-ci.yml"
  pull_request:
    paths:
      - "runtime/testbot_backtest_api.py"
      - "runtime/ten_pair_backtest_api.py"
      - "runtime/locked_backtest_freqtrade.py"
      - "runtime/locked_freqtrade.py"
      - "runtime/patch_frequi.py"
      - "runtime/ui/testbot-backtest.js"
      - "runtime/scripts/setup-venv.ps1"
      - "runtime/user_data/config.json"
      - "runtime/user_data/strategies/CompressionBreakout250.py"
      - "tests/test_testbot_backtest_api.py"
      - "tests/test_backtest_history_coverage.py"
      - "tests/test_backtest_candle_integrity.py"
      - "tests/runtime/test_v12_17_ten_pair_research_contract.py"
      - ".github/workflows/windows-backtest-ui-ci.yml"
  workflow_dispatch:

jobs:
  backtest-ui-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked environment
        shell: powershell
        run: uv sync --frozen --all-extras --python 3.12
      - name: Unit tests
        shell: powershell
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          tests\test_testbot_backtest_api.py
          tests\test_backtest_history_coverage.py
          tests\test_backtest_candle_integrity.py
          tests\runtime\test_v12_17_ten_pair_research_contract.py
      - name: Ruff runtime and tests
        shell: powershell
        run: >-
          .\.venv\Scripts\ruff.exe check
          runtime\testbot_backtest_api.py
          runtime\ten_pair_backtest_api.py
          runtime\locked_backtest_freqtrade.py
          runtime\locked_freqtrade.py
          runtime\patch_frequi.py
          tests\test_testbot_backtest_api.py
          tests\test_backtest_history_coverage.py
          tests\test_backtest_candle_integrity.py
          tests\runtime\test_v12_17_ten_pair_research_contract.py
      - name: Ruff active Freqtrade strategy
        shell: powershell
        run: >-
          .\.venv\Scripts\ruff.exe check --ignore RUF012
          runtime\user_data\strategies\CompressionBreakout250.py
