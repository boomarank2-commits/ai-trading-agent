name: V8 B1 volume100 research contract

on:
  push:
    branches:
      - research/v8-volume100-20260816
  pull_request:
    paths:
      - "runtime/user_data/strategies/CompressionBreakout250.py"
      - "tests/research/**"
      - "docs/V8_B1_VOLUME100_EXPERIMENT_DE.md"
      - "research/trial_ledger.csv"
      - ".github/workflows/windows-v8-b1-volume100-research-ci.yml"
  workflow_dispatch:

jobs:
  research-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync exact locked environment
        shell: powershell
        run: uv sync --frozen --all-extras --python 3.12
      - name: Compile research strategy
        shell: powershell
        run: .\.venv\Scripts\python.exe -m py_compile runtime\user_data\strategies\CompressionBreakout250.py
      - name: Research and backtest contracts
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest -q tests\research\test_v8_volume100_contract.py tests\test_testbot_backtest_api.py tests\test_backtest_history_coverage.py tests\test_backtest_candle_integrity.py
      - name: Ruff
        shell: powershell
        run: .\.venv\Scripts\ruff.exe check runtime\user_data\strategies\CompressionBreakout250.py tests\research\test_v8_volume100_contract.py
