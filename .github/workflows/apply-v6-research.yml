name: Apply V6 momentum strategy

on:
  push:
    branches:
      - agent/strategy-v6-4h-momentum-breakout
    paths:
      - research/apply_v6_momentum.py
      - .github/workflows/apply-v6-research.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strategy-v6-4h-momentum-breakout
          fetch-depth: 0
      - name: Transform V2 into V6 research strategy
        run: |
          python research/apply_v6_momentum.py
          python -m py_compile runtime/user_data/strategies/CompressionBreakout250.py
          grep -q 'slow_4h_momentum_breakout' runtime/user_data/strategies/CompressionBreakout250.py
      - name: Commit durable strategy only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm research/apply_v6_momentum.py .github/workflows/apply-v6-research.yml
          git add runtime/user_data/strategies/CompressionBreakout250.py
          git commit -m "Add slow 4h momentum strategy V6"
          git push origin HEAD:agent/strategy-v6-4h-momentum-breakout
