name: Apply V8 paper-candidate runtime hardening

on:
  push:
    branches: [agent/promote-v8-paper-candidate]
    paths:
      - research/apply_v8_paper_hardening.py
      - .github/workflows/apply-v8-paper-hardening.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-v8-paper-candidate
          fetch-depth: 0
      - name: Apply runtime contract changes
        run: |
          python research/apply_v8_paper_hardening.py
          grep -q tradesv8.dryrun.sqlite runtime/scripts/start-testbot-24x7.ps1
          grep -q 'minimal_roi' runtime/validate_dryrun_config.py
      - name: Commit durable files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm research/apply_v8_paper_hardening.py .github/workflows/apply-v8-paper-hardening.yml
          git add runtime/scripts/start-testbot-24x7.ps1 runtime/validate_dryrun_config.py tests/runtime/test_testbot_launcher.py tests/runtime/test_validate_dryrun_config.py
          git commit -m "Isolate and lock V8 paper forward-test contract"
          git push origin HEAD:agent/promote-v8-paper-candidate
