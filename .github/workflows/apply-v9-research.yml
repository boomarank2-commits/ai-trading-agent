name: Apply V9 4h pullback strategy
on:
  push:
    branches: [agent/strategy-v9-4h-pullback]
    paths: [research/apply_v9_4h_pullback.py, .github/workflows/apply-v9-research.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/strategy-v9-4h-pullback, fetch-depth: 0}
      - run: |
          python research/apply_v9_4h_pullback.py
          python -m py_compile runtime/user_data/strategies/CompressionBreakout250.py
          grep -q slow_4h_pullback_reclaim runtime/user_data/strategies/CompressionBreakout250.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm research/apply_v9_4h_pullback.py .github/workflows/apply-v9-research.yml
          git add runtime/user_data/strategies/CompressionBreakout250.py
          git commit -m "Add slow 4h pullback strategy V9"
          git push origin HEAD:agent/strategy-v9-4h-pullback
