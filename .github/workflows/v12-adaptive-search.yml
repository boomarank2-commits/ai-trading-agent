name: V12 Adaptive Pair Search

on:
  push:
    branches:
      - agent/v12-adaptive-league
    paths:
      - "runtime/adaptive_pair_optimizer.py"
      - ".github/workflows/v12-adaptive-search.yml"
  workflow_dispatch:

jobs:
  pair-search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked environment
        run: uv sync --frozen --all-extras --python 3.12
      - name: Run rolling 730d training plus 365d blind search
        run: |
          .venv/bin/python runtime/adaptive_pair_optimizer.py \
            --start 2021-08-01 \
            --folds 3 \
            --cache runtime/user_data/v12_public_cache \
            --out v12-results/v12_optimizer_report.json
      - name: Show compact result
        if: always()
        run: |
          if [ -f v12-results/v12_optimizer_report.json ]; then
            .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('v12-results/v12_optimizer_report.json').read_text())
          for symbol, result in p['results'].items():
              a = result['aggregate']
              print(symbol, 'aggregate=', a['blind'], 'positive_folds=', f"{a['positive_folds']}/{a['fold_count']}", 'stress=', a['blind_stress_fee_0_003'], 'families=', a['family_pnl'])
              for i, fold in enumerate(result['folds'], 1):
                  print(' ', 'fold', i, fold['blind'], 'specialists=', fold['router_specialists'], 'families=', fold['blind_family_pnl'])
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-adaptive-search-results
          path: v12-results/
          if-no-files-found: warn
