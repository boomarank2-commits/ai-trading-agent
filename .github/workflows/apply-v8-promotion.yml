name: Prepare exact V8 paper candidate

on:
  push:
    branches: [agent/promote-v8-paper-candidate]
    paths: [".github/workflows/apply-v8-promotion.yml"]
permissions:
  contents: write
jobs:
  copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-v8-paper-candidate
          fetch-depth: 0
      - name: Copy exact validated V8 strategy and execution config
        run: |
          git fetch origin agent/strategy-v8-slow-donchian
          git show origin/agent/strategy-v8-slow-donchian:runtime/user_data/strategies/CompressionBreakout250.py > runtime/user_data/strategies/CompressionBreakout250.py
          git show origin/agent/strategy-v8-slow-donchian:runtime/user_data/config.json > runtime/user_data/config.json
          ACTUAL=$(sha256sum runtime/user_data/strategies/CompressionBreakout250.py | awk '{print $1}')
          test "$ACTUAL" = "9717526a6b7ef25dd50f79fbefe681cdc316847ffc309142e1a69be38c10c155"
          python -m py_compile runtime/user_data/strategies/CompressionBreakout250.py
      - name: Commit only production candidate files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v8-promotion.yml
          git add runtime/user_data/strategies/CompressionBreakout250.py runtime/user_data/config.json
          git commit -m "Promote exact V8 strategy as paper candidate"
          git push origin HEAD:agent/promote-v8-paper-candidate
