name: Apply V4 research transformation

on:
  push:
    branches:
      - agent/strategy-v4-trend-pullback
    paths:
      - .github/workflows/apply-v4-research.yml
      - research/apply_v4.py

permissions:
  contents: write

jobs:
  apply-v4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strategy-v4-trend-pullback
          fetch-depth: 0
      - name: Transform strategy
        shell: bash
        run: |
          python research/apply_v4.py
          python -m py_compile runtime/user_data/strategies/CompressionBreakout250.py
          grep -q 'trend_pullback_reclaim' runtime/user_data/strategies/CompressionBreakout250.py
      - name: Commit strategy only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm research/apply_v4.py
          git rm research/strategy-v4-trend-pullback.patch
          git rm .github/workflows/apply-v4-research.yml
          git add runtime/user_data/strategies/CompressionBreakout250.py
          git commit -m "Add trend-pullback strategy V4"
          git push origin HEAD:agent/strategy-v4-trend-pullback
