name: V6 exact three-year research

on:
  push:
    branches:
      - agent/strategy-v6-4h-momentum-breakout
    paths:
      - "runtime/user_data/strategies/CompressionBreakout250.py"
      - "runtime/user_data/config.json"
      - "research/config-binance-marketdata-only.json"
      - ".github/workflows/research-v6-backtests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked environment
        run: uv sync --frozen --all-extras --python 3.12
      - name: Cache complete Binance history
        uses: actions/cache@v4
        with:
          path: research_data
          key: binance-spot-btc-eth-sol-1m15m1h4h-20230601-20260816-v2-marketdata-only
      - name: Download or refresh exact public history
        run: |
          mkdir -p research_data research_results
          .venv/bin/python -m freqtrade download-data \
            --config runtime/user_data/config.json \
            --config runtime/user_data/config-public.json \
            --config research/config-binance-marketdata-only.json \
            --userdir runtime/user_data --datadir "$PWD/research_data" \
            --timeframes 1m 15m 1h 4h --pairs BTC/USDT ETH/USDT SOL/USDT \
            --trading-mode spot --timerange 20230601-20260816
      - name: Prove data integrity and strategy causality prerequisites
        run: |
          .venv/bin/python - <<'PY' | tee research_results/data-integrity.txt
          from pathlib import Path
          import pandas as pd
          seconds={'1m':60,'15m':900,'1h':3600,'4h':14400}
          files=sorted(Path('research_data').rglob('*.feather'))
          assert len(files)==12, len(files)
          for p in files:
              df=pd.read_feather(p); d=pd.to_datetime(df['date'],utc=True)
              tf=next(t for t in seconds if f'-{t}' in p.name)
              diffs=d.diff().dropna(); gap=int((diffs>pd.to_timedelta(seconds[tf],unit='s')).sum())
              assert int(d.duplicated().sum())==0, p
              assert int((diffs<=pd.Timedelta(0)).sum())==0, p
              assert gap==0, (p,gap)
              assert d.min()<=pd.Timestamp('2023-06-01 00:00:00',tz='UTC'), p
              assert d.max()>=pd.Timestamp('2026-08-15 16:00:00',tz='UTC'), p
              print(f'{p.name}: rows={len(df)} start={d.min()} end={d.max()} gaps={gap}')
          PY
          .venv/bin/python -m py_compile runtime/user_data/strategies/CompressionBreakout250.py
          .venv/bin/ruff check runtime/user_data/strategies/CompressionBreakout250.py
          grep -q slow_4h_momentum_breakout runtime/user_data/strategies/CompressionBreakout250.py
          sha256sum runtime/user_data/strategies/CompressionBreakout250.py | tee research_results/strategy-sha256.txt
      - name: Run exact pair, portfolio and temporal matrix
        run: |
          set -euo pipefail
          SHA=$(sha256sum runtime/user_data/strategies/CompressionBreakout250.py | awk '{print $1}')
          run_bt(){ NAME="$1"; RANGE="$2"; shift 2; mkdir -p "research_results/$NAME"; \
            .venv/bin/python runtime/locked_backtest_freqtrade.py \
            --strategy-source runtime/user_data/strategies/CompressionBreakout250.py \
            --strategy-sha256 "$SHA" --strategy-class CompressionBreakout250 -- \
            backtesting --config runtime/user_data/config.json --config runtime/user_data/config-public.json \
            --config research/config-binance-marketdata-only.json --userdir runtime/user_data \
            --datadir "$PWD/research_data" --strategy CompressionBreakout250 --pairs "$@" \
            --timerange "$RANGE" --timeframe-detail 1m --fee 0.002 --enable-protections \
            --dry-run-wallet 250 --cache none --export trades --backtest-directory "research_results/$NAME" \
            --breakdown month 2>&1 | tee "research_results/$NAME/run.log"; }
          run_bt btc_full 20230816-20260816 BTC/USDT
          run_bt eth_full 20230816-20260816 ETH/USDT
          run_bt sol_full 20230816-20260816 SOL/USDT
          run_bt portfolio_full 20230816-20260816 BTC/USDT ETH/USDT SOL/USDT
          run_bt portfolio_y1 20230816-20240816 BTC/USDT ETH/USDT SOL/USDT
          run_bt portfolio_y2 20240816-20250816 BTC/USDT ETH/USDT SOL/USDT
          run_bt portfolio_y3 20250816-20260816 BTC/USDT ETH/USDT SOL/USDT
      - name: Summarize result evidence
        run: |
          .venv/bin/python - <<'PY' | tee research_results/SUMMARY.md
          import json,zipfile
          from pathlib import Path
          runs=['btc_full','eth_full','sol_full','portfolio_full','portfolio_y1','portfolio_y2','portfolio_y3']
          print('# V6 exact research summary\n')
          print('| run | trades | P/L USDT | return % | PF | win % | max DD % |')
          print('|---|---:|---:|---:|---:|---:|---:|')
          for run in runs:
              z=sorted((Path('research_results')/run).glob('backtest-result-*.zip'))[-1]
              with zipfile.ZipFile(z) as f:
                  n=[x for x in f.namelist() if x.endswith('.json') and 'config' not in x and 'market_change' not in x][0]
                  st=json.loads(f.read(n))['strategy']['CompressionBreakout250']
              ts=st.get('trades',[]); ntr=int(st.get('total_trades',len(ts))); pnl=float(st.get('profit_total_abs',0)); ret=float(st.get('profit_total',0))*100
              pf=float(st.get('profit_factor',0) or 0); wins=int(st.get('wins',0) or 0); dd=float(st.get('max_drawdown_account',0) or st.get('max_drawdown',0) or 0)
              if abs(dd)<=1: dd*=100
              print(f'| {run} | {ntr} | {pnl:.3f} | {ret:.3f} | {pf:.3f} | {(100*wins/ntr if ntr else 0):.1f} | {dd:.2f} |')
              reasons={}
              for t in ts:
                  r=t.get('exit_reason','unknown'); reasons.setdefault(r,[0,0.0]); reasons[r][0]+=1; reasons[r][1]+=float(t.get('profit_abs',0) or 0)
              print(); print(f'## {run} exits')
              for r,(c,p) in sorted(reasons.items(),key=lambda x:x[1][1]): print(f'- {r}: {c} trades, {p:.3f} USDT')
              print()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v6-exact-three-year-research
          path: research_results
          retention-days: 30
