name: hixton-v1-trade-diagnostics

on:
  push:
    branches:
      - agent/hixton-v1-trade-diagnostics
  pull_request:
    paths:
      - "runtime/user_data/strategies/CompressionBreakout250.py"
      - "runtime/user_data/config.json"
      - "runtime/ten_pair_backtest_api.py"
      - "runtime/testbot_backtest_api.py"
      - "runtime/ui/testbot-backtest.js"
      - "runtime/validate_dryrun_config.py"
      - "research/hixton_trial_ledger.csv"
      - "research/hixton_executed_test_fingerprints.csv"
      - "tests/runtime/test_hixton_clean_reset.py"
      - "tests/runtime/test_hixton_runtime_smoke.py"
      - ".github/workflows/hixton-clean-reset.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync exact locked environment
        run: uv sync --frozen --all-extras --python 3.12
      - name: Print diagnostic strategy SHA256
        run: .\.venv\Scripts\python.exe -c "import hashlib, pathlib; p=pathlib.Path('runtime/user_data/strategies/CompressionBreakout250.py'); print('STRATEGY_SHA256=' + hashlib.sha256(p.read_bytes()).hexdigest())"
      - name: Verify isolated Hixton diagnostic contract
        run: .\.venv\Scripts\python.exe tests\runtime\test_hixton_clean_reset.py
      - name: Verify Hixton runtime math and Freqtrade loading
        run: .\.venv\Scripts\python.exe -m pytest -q tests\runtime\test_hixton_runtime_smoke.py
      - name: Ruff Hixton branch files
        run: .\.venv\Scripts\ruff.exe check --ignore E501,RUF001 runtime\user_data\strategies\CompressionBreakout250.py runtime\ten_pair_backtest_api.py runtime\validate_dryrun_config.py tests\runtime\test_hixton_clean_reset.py tests\runtime\test_hixton_runtime_smoke.py
