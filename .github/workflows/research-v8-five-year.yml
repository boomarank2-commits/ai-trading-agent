name: V8 exact five-year continuity test

on:
  push:
    branches: [agent/strategy-v8-slow-donchian]
    paths:
      - ".github/workflows/research-v8-five-year.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-year:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras --python 3.12
      - uses: actions/cache@v4
        with:
          path: fiveyear_data
          key: binance-spot-btc-eth-sol-1m15m1h4h-20210601-20260817-v1
      - name: Download exact five-year-plus-warmup history
        run: |
          mkdir -p fiveyear_data fiveyear_results
          .venv/bin/python -m freqtrade download-data --config runtime/user_data/config.json --config runtime/user_data/config-public.json --config research/config-binance-marketdata-only.json --userdir runtime/user_data --datadir "$PWD/fiveyear_data" --timeframes 1m 15m 1h 4h --pairs BTC/USDT ETH/USDT SOL/USDT --trading-mode spot --timerange 20210601-20260817
      - name: Prove all twelve candle files are continuous
        run: |
          .venv/bin/python - <<'PY' | tee fiveyear_results/data-integrity.txt
          from pathlib import Path
          import pandas as pd
          sec={'1m':60,'15m':900,'1h':3600,'4h':14400}; fs=sorted(Path('fiveyear_data').rglob('*.feather')); assert len(fs)==12, len(fs)
          for p in fs:
              d=pd.to_datetime(pd.read_feather(p)['date'],utc=True); tf=next(t for t in sec if f'-{t}' in p.name); x=d.diff().dropna()
              dup=int(d.duplicated().sum()); bad=int((x<=pd.Timedelta(0)).sum()); gaps=int((x>pd.to_timedelta(sec[tf],unit='s')).sum())
              assert dup==0 and bad==0 and gaps==0, (p,dup,bad,gaps)
              assert d.min()<=pd.Timestamp('2021-06-01',tz='UTC') and d.max()>=pd.Timestamp('2026-08-15 16:00',tz='UTC')
              print(f'{p.name}: rows={len(d)} start={d.min()} end={d.max()} duplicates={dup} gaps={gaps}')
          PY
          .venv/bin/python -m py_compile runtime/user_data/strategies/CompressionBreakout250.py
          .venv/bin/ruff check runtime/user_data/strategies/CompressionBreakout250.py
          sha256sum runtime/user_data/strategies/CompressionBreakout250.py | tee fiveyear_results/strategy-sha256.txt
      - name: Run exact five-year pair and shared-wallet portfolio tests
        run: |
          set -euo pipefail
          SHA=$(sha256sum runtime/user_data/strategies/CompressionBreakout250.py|awk '{print $1}')
          bt(){ N="$1"; shift; mkdir -p "fiveyear_results/$N"; .venv/bin/python runtime/locked_backtest_freqtrade.py --strategy-source runtime/user_data/strategies/CompressionBreakout250.py --strategy-sha256 "$SHA" --strategy-class CompressionBreakout250 -- backtesting --config runtime/user_data/config.json --config runtime/user_data/config-public.json --config research/config-binance-marketdata-only.json --userdir runtime/user_data --datadir "$PWD/fiveyear_data" --strategy CompressionBreakout250 --pairs "$@" --timerange 20210816-20260816 --timeframe-detail 1m --fee 0.002 --enable-protections --dry-run-wallet 250 --cache none --export trades --backtest-directory "fiveyear_results/$N" --breakdown year > "fiveyear_results/$N/run.log" 2>&1; }
          bt btc_5y BTC/USDT
          bt eth_5y ETH/USDT
          bt sol_5y SOL/USDT
          bt portfolio_5y BTC/USDT ETH/USDT SOL/USDT
      - name: Summarize five-year continuity result
        run: |
          .venv/bin/python - <<'PY' | tee fiveyear_results/SUMMARY.md
          import json,zipfile
          from pathlib import Path
          runs=['btc_5y','eth_5y','sol_5y','portfolio_5y']
          print('# V8 exact 5-year continuity summary\n\n| run | trades | P/L USDT | return % | PF | win % | max DD % |\n|---|---:|---:|---:|---:|---:|---:|')
          for run in runs:
              z=sorted((Path('fiveyear_results')/run).glob('backtest-result-*.zip'))[-1]
              with zipfile.ZipFile(z) as f:
                  n=[x for x in f.namelist() if x.endswith('.json') and 'config' not in x and 'market_change' not in x][0]; st=json.loads(f.read(n))['strategy']['CompressionBreakout250']
              ts=st.get('trades',[]); c=int(st.get('total_trades',len(ts))); pnl=float(st.get('profit_total_abs',0)); ret=float(st.get('profit_total',0))*100; pf=float(st.get('profit_factor',0) or 0); w=int(st.get('wins',0) or 0); dd=float(st.get('max_drawdown_account',0) or st.get('max_drawdown',0) or 0); dd=dd*100 if abs(dd)<=1 else dd
              print(f'| {run} | {c} | {pnl:.3f} | {ret:.3f} | {pf:.3f} | {(100*w/c if c else 0):.1f} | {dd:.2f} |')
              yearly=st.get('yearly_breakdown') or st.get('breakdown',{}).get('year') or []
              print(); print(f'## {run} yearly raw'); print('```json'); print(json.dumps(yearly,indent=2,default=str)); print('```\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v8-exact-five-year-continuity
          path: fiveyear_results
          retention-days: 30
